{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена - VoteMania</title>
    <link rel="stylesheet" type="text/css" href="{% static 'Not_Found/css/styles.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="error-container">
        <div class="astronaut">👨‍🚀</div>
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Страница не найдена</h2>
        <p class="error-message">
            Упс! Похоже, вы попали в открытый космос. Страница, которую вы ищете, не существует или была перемещена.
        </p>
        <div class="mt-4">
            <a href="{% url 'home' %}" class="btn btn-primary-custom btn-lg">
                <i class="fas fa-home me-2"></i>Вернуться домой
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-custom btn-lg">
                <i class="fas fa-arrow-left me-2"></i>Назад
            </a>
        </div>
        <div class="mt-4">
            <p class="text-muted">
                <i class="fas fa-info-circle me-2"></i>
                Ошибка 404: запрашиваемая страница не найдена
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
