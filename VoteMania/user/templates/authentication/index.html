{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - VoteMania</title>
    <link rel="stylesheet" type="text/css" href="{% static 'authentication/css/styles.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1><i class="fas fa-sign-in-alt me-2"></i>Вход</h1>
            <p>Войдите в свой аккаунт VoteMania</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Введите ваш email" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Введите ваш пароль" required>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember" name="remember">
                    <label class="form-check-label" for="remember">Запомнить меня</label>
                </div>
                <a href="#" class="text-decoration-none">Забыли пароль?</a>
            </div>

            <button type="submit" class="btn btn-primary-custom btn-custom">
                <i class="fas fa-sign-in-alt me-2"></i>Войти
            </button>
        </form>

        <div class="divider">
            <span>или войти через</span>
        </div>

        <div class="social-login">
            <a href="#" class="social-btn telegram-btn">
                <i class="fab fa-telegram-plane"></i>
                Telegram
            </a>
        </div>

        <div class="auth-footer">
            <p>Нет аккаунта? <a href="{% url 'register' %}">Зарегистрируйтесь</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
