{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - VoteMania</title>
    <link rel="stylesheet" type="text/css" href="{% static 'register/css/styles.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1><i class="fas fa-user-plus me-2"></i>Регистрация</h1>
            <p>Создайте новый аккаунт VoteMania</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username" class="form-label">Имя пользователя</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Введите имя пользователя" required>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Введите ваш email" required>
            </div>

            <div class="form-group">
                <label for="telegram" class="form-label">Никнейм в Telegram (опционально)</label>
                <div class="input-group">
                    <span class="input-group-text">@</span>
                    <input type="text" class="form-control" id="telegram" name="telegram" placeholder="ваш_никнейм">
                </div>
                <small class="form-text text-muted">Без символа @. Мы можем использовать это для уведомлений.</small>
            </div>

            <div class="form-group">
                <label for="password1" class="form-label">Пароль</label>
                <input type="password" class="form-control" id="password1" name="password1" placeholder="Введите пароль" required>
                <div class="password-strength" id="passwordStrength">
                    <div class="password-strength-meter"></div>
                </div>
                <small class="form-text text-muted">Пароль должен содержать минимум 8 символов</small>
            </div>

            <div class="form-group">
                <label for="password2" class="form-label">Подтверждение пароля</label>
                <input type="password" class="form-control" id="password2" name="password2" placeholder="Повторите пароль" required>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="terms" name="terms" required>
                <label class="form-check-label" for="terms">
                    Я согласен с <a href="#" class="text-decoration-none">условиями использования</a> и <a href="#" class="text-decoration-none">политикой конфиденциальности</a>
                </label>
            </div>

            <button type="submit" class="btn btn-primary-custom btn-custom">
                <i class="fas fa-user-plus me-2"></i>Зарегистрироваться
            </button>
        </form>

        <div class="divider">
            <span>или зарегистрироваться через</span>
        </div>

        <div class="social-login">
            <a href="#" class="social-btn telegram-btn">
                <i class="fab fa-telegram-plane"></i>
                Telegram
            </a>
        </div>

        <div class="auth-footer">
            <p>Уже есть аккаунт? <a href="{% url 'authentication' %}">Войдите</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Простая проверка силы пароля
        document.getElementById('password1').addEventListener('input', function() {
            const password = this.value;
            const strengthMeter = document.querySelector('.password-strength');
            strengthMeter.className = 'password-strength';

            if (password.length >= 8) {
                if (password.length >= 12 && /[A-Z]/.test(password) && /[0-9]/.test(password)) {
                    strengthMeter.classList.add('strong');
                } else if (password.length >= 8) {
                    strengthMeter.classList.add('medium');
                }
            } else if (password.length > 0) {
                strengthMeter.classList.add('weak');
            }
        });
    </script>
</body>
</html>
